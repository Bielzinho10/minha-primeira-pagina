<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sobre Mim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">

    <!-- Alerta Bootstrap -->
    <div class="alert alert-info text-center" role="alert">
      Esta e a minha primeira pagina com ASP.NET e Bootstrap! 🚀
    </div>

    <!-- Card Bootstrap -->
    <div class="card mx-auto" style="max-width: 600px;">
      <div class="card-body text-center">
        <img src="https://via.placeholder.com/200" alt="Foto de perfil" class="img-fluid rounded mb-3">
        <h2 class="card-title">Seu Nome Aqui</h2>
        <p class="card-text">
          Ola! Meu nome e <strong>Seu Nome</strong>. Sou estudante de desenvolvimento web e estou explorando o ASP.NET com Bootstrap. Gosto de tecnologia, cafe e resolver problemas com codigo.
        </p>
        <a href="/" class="btn btn-primary mt-3">Voltar a Pagina Inicial</a>
      </div>
    </div>

  </div>

</body>
</html>
